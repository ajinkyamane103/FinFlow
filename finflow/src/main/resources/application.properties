spring.application.name=FinFlow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# JWT_SECRET must be a random value of at least 32 bytes. It is intentionally not
# given a usable default so a misconfigured deployment fails at startup.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000
